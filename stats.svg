  <line x1="35" y1="85" x2="745" y2="85" stroke="#1f293d" stroke-width="1.5" />

  <g transform="translate(35, 115)">
    <text x="0" y="0" class="label">Public Repositories</text>
    <text x="0" y="26" class="val">4</text>

